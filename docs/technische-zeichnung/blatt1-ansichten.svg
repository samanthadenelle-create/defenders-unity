<text x="24.000" y="284.000" class="note" text-anchor="start">4  Eckenfreischnitt 1 x 20 mm je Ecke, damit sich die Schenkel beim Kanten nicht &#252;berdecken.</text>
<text x="24.000" y="288.400" class="note" text-anchor="start">5  Ma&#223;e der Abwicklung siehe Blatt 2. Ma&#223;e sind theoretische Au&#223;enma&#223;e (scharfkantig),</text>
<text x="24.000" y="292.800" class="note" text-anchor="start">   Biegezugabe/Ausgleich ist nicht ber&#252;cksichtigt.</text>
