<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Echoes of Elarion — Raids</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0c10;
        color: #f2ecdc;
        font-family: Georgia, "Times New Roman", serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px 48px;
      }
      h1 {
        font-size: clamp(22px, 4vw, 32px);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 6px;
        color: #d8b45c;
      }
      p.sub {
        margin: 0 0 24px;
        color: #b9b1a0;
        font-size: 15px;
      }
      video {
        width: 100%;
        max-width: 960px;
        border: 1px solid #3a3226;
        border-radius: 10px;
        background: #000;
        display: block;
      }
      a.home {
        margin-top: 20px;
        color: #d8b45c;
        text-decoration: none;
        font-size: 14px;
        border: 1px solid #55492f;
        padding: 8px 16px;
        border-radius: 6px;
      }
      a.home:hover { background: #1a1712; }
    </style>
  </head>
  <body>
    <h1>Raids</h1>
    <p class="sub">Echoes of Elarion</p>
    <video controls playsinline preload="metadata">
      <source src="media/raids.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <a class="home" href="/">Play the game</a>
  </body>
</html>
